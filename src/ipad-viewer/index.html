<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPad Display">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>iPad Display</title>
    <style>
      html, body, video { width: 100%; height: 100%; margin: 0; background: #000; }
      video { display: block; object-fit: contain; }
      #touch-surface { position: fixed; inset: 0; z-index: 1; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #touch-surface[hidden] { display: none; }
      #touch-control { position: fixed; z-index: 3; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); min-width: 56px; min-height: 44px; border: 1px solid rgba(255, 255, 255, .45); border-radius: 10px; background: rgba(24, 24, 24, .86); color: #fff; font: 600 14px -apple-system, sans-serif; }
      #touch-control[hidden] { display: none; }
      #status { position: fixed; z-index: 2; inset: auto 12px 12px; color: #777; font: 12px -apple-system, sans-serif; pointer-events: none; }
      #status[hidden] { display: none; }
      #fullscreen-hint { position: fixed; z-index: 2; inset: auto 12px 12px; color: #bbb; font: 12px -apple-system, sans-serif; pointer-events: none; }
      #fullscreen-hint[hidden] { display: none; }
    </style>
  </head>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <div id="touch-surface" hidden aria-hidden="true"></div>
    <button id="touch-control" type="button" hidden></button>
    <div id="status">Connecting…</div>
    <div id="fullscreen-hint" hidden>Tap for fullscreen</div>
    <script src="/vendor/socket.io.min.js"></script>
    <script src="/vendor/simplepeer.min.js"></script>
    <script>
      (() => {
        const ROOM_ID = 'ipad-main';
        const video = document.getElementById('video');
        const touchSurface = document.getElementById('touch-surface');
        const touchControl = document.getElementById('touch-control');
        const status = document.getElementById('status');
        const fullscreenHint = document.getElementById('fullscreen-hint');
        const SimplePeer = window['SimplePeer'];
        const connectSocket = window['io'];
        const VIEWER_ID_STORAGE_KEY = 'ipad-display.logical-viewer-id';
        const createViewerId = () =>
          crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
        const getLogicalViewerId = () => {
          try {
            const existingId = window.localStorage.getItem(VIEWER_ID_STORAGE_KEY);
            if (existingId) return existingId;
            const createdId = createViewerId();
            window.localStorage.setItem(VIEWER_ID_STORAGE_KEY, createdId);
            return createdId;
          } catch {
            // Storage can be unavailable in private or restricted browser contexts.
            return createViewerId();
          }
        };
        // A socket identifies one transport connection; this ID identifies the
        // iPad browser profile so a Safari relaunch can atomically replace it.
        const logicalViewerId = getLogicalViewerId();
        const viewerDocumentId = createViewerId();

        let peer = null;
        let isStreaming = false;
        let lastFullscreenGestureAt = 0;
        let peerRecoveryInProgress = false;
        let pageIsTearingDown = false;
        let lifecycle = null;
        let registeredGeneration = null;
        let deviceDetailsGeneration = null;
        let needsFreshPeer = false;
        let touchEnabled = false;
        let touchCapabilityKnown = false;
        let macControlEnabled = true;
        let touchGesture = { mode: 'idle', primaryId: null, start: null, last: null };
        const DRAG_THRESHOLD_PX = 12;

        const setStatus = (text, isStreaming = false) => {
          status.textContent = text;
          status.hidden = isStreaming;
        };

        // iPadOS WebKit can expose element fullscreen only through its legacy
        // state properties, leaving the modern element slots unset.
        const isFullscreen = () =>
          Boolean(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.webkitCurrentFullScreenElement ||
            document.webkitIsFullScreen,
          );

        const updateFullscreenHint = () => {
          fullscreenHint.hidden = !isStreaming || Boolean(isFullscreen());
        };

        const videoPoint = (touch) => {
          if (!touch || !video.videoWidth || !video.videoHeight) return null;
          const box = video.getBoundingClientRect();
          const scale = Math.min(box.width / video.videoWidth, box.height / video.videoHeight);
          const width = video.videoWidth * scale;
          const height = video.videoHeight * scale;
          const left = box.left + (box.width - width) / 2;
          const top = box.top + (box.height - height) / 2;
          if (touch.clientX < left || touch.clientX > left + width || touch.clientY < top || touch.clientY > top + height) return null;
          return {
            x: (touch.clientX - left) / width,
            y: (touch.clientY - top) / height,
            clientX: touch.clientX,
            clientY: touch.clientY,
          };
        };

        const touchWithId = (touches, identifier) =>
          Array.from(touches).find((touch) => touch.identifier === identifier);

        const centroid = (touches) => {
          const points = Array.from(touches).slice(0, 2).map(videoPoint);
          if (points.length !== 2 || !points[0] || !points[1]) return null;
          return {
            x: (points[0].x + points[1].x) / 2,
            y: (points[0].y + points[1].y) / 2,
            clientX: (points[0].clientX + points[1].clientX) / 2,
            clientY: (points[0].clientY + points[1].clientY) / 2,
          };
        };

        const canSendTouch = () =>
          touchEnabled && macControlEnabled && isStreaming && Boolean(isFullscreen()) && lifecycle &&
          lifecycle.phase === 'streaming' && lifecycle.viewer?.socketId === socket.id;

        const emitInput = (action, point, deltaX, deltaY) => {
          if (!canSendTouch() || !point) return;
          const payload = {
            action,
            x: point.x,
            y: point.y,
            generation: lifecycle.generation,
            sessionId: lifecycle.sessionId,
          };
          if (action === 'scroll') {
            payload.deltaX = deltaX;
            payload.deltaY = deltaY;
          }
          const emitter = action === 'drag' || action === 'scroll' || action === 'move'
            ? (socket.volatile || socket) : socket;
          emitter.emit('IPAD_INPUT', payload);
        };

        const releaseActiveDrag = () => {
          if (touchGesture.mode === 'dragging' && touchGesture.last) {
            emitInput('up', touchGesture.last);
            touchGesture = { mode: 'idle', primaryId: null, start: null, last: null };
          }
        };

        const resetTouchGesture = () => {
          releaseActiveDrag();
          touchGesture = { mode: 'idle', primaryId: null, start: null, last: null };
        };

        const ignoreTouchesUntilLift = () => {
          releaseActiveDrag();
          touchGesture = { mode: 'ignored', primaryId: null, start: null, last: null };
        };

        const handleTouchStart = (event) => {
          event.preventDefault();
          if (!canSendTouch()) return;
          if (event.touches.length >= 3) {
            event.preventDefault();
            ignoreTouchesUntilLift();
            return;
          }
          if (touchGesture.mode === 'ignored' || touchGesture.mode === 'dragging' || touchGesture.mode === 'scrolling') return;
          if (event.touches.length === 1) {
            const start = videoPoint(event.touches[0]);
            if (!start) {
              ignoreTouchesUntilLift();
              return;
            }
            event.preventDefault();
            touchGesture = { mode: 'pending', primaryId: event.touches[0].identifier, start, last: start };
            return;
          }
          const center = centroid(event.touches);
          event.preventDefault();
          if (!center || touchGesture.mode !== 'pending') {
            ignoreTouchesUntilLift();
            return;
          }
          // This is a positioning move for scrolling, not general hover forwarding.
          emitInput('move', center);
          touchGesture = { mode: 'scrolling', primaryId: null, start: null, last: center };
        };

        const handleTouchMove = (event) => {
          event.preventDefault();
          if (!canSendTouch()) return;
          if (event.touches.length >= 3) {
            event.preventDefault();
            ignoreTouchesUntilLift();
            return;
          }
          if (touchGesture.mode === 'ignored') return;
          if (touchGesture.mode === 'scrolling') {
            const center = centroid(event.touches);
            if (!center || !touchGesture.last) return;
            event.preventDefault();
            const deltaX = center.x - touchGesture.last.x;
            const deltaY = center.y - touchGesture.last.y;
            if (deltaX || deltaY) emitInput('scroll', center, deltaX, deltaY);
            touchGesture.last = center;
            return;
          }
          const touch = touchWithId(event.touches, touchGesture.primaryId);
          const point = videoPoint(touch);
          if (!point) return;
          event.preventDefault();
          if (touchGesture.mode === 'pending') {
            const distance = Math.hypot(point.clientX - touchGesture.start.clientX, point.clientY - touchGesture.start.clientY);
            if (distance > DRAG_THRESHOLD_PX) {
              emitInput('down', touchGesture.start);
              touchGesture.mode = 'dragging';
            }
          }
          if (touchGesture.mode === 'dragging') emitInput('drag', point);
          touchGesture.last = point;
        };

        const handleTouchEnd = (event) => {
          event.preventDefault();
          if (!canSendTouch()) return;
          if (touchGesture.mode === 'ignored') {
            if (event.touches.length === 0) touchGesture = { mode: 'idle', primaryId: null, start: null, last: null };
            return;
          }
          if (touchGesture.mode === 'scrolling') {
            if (event.touches.length < 2) touchGesture = event.touches.length ? { mode: 'ignored', primaryId: null, start: null, last: null } : { mode: 'idle', primaryId: null, start: null, last: null };
            return;
          }
          const ended = touchWithId(event.changedTouches, touchGesture.primaryId);
          if (!ended) return;
          event.preventDefault();
          const point = videoPoint(ended) || touchGesture.last;
          if (touchGesture.mode === 'pending' && point) emitInput('click', point);
          if (touchGesture.mode === 'dragging' && point) emitInput('up', point);
          touchGesture = event.touches.length ? { mode: 'ignored', primaryId: null, start: null, last: null } : { mode: 'idle', primaryId: null, start: null, last: null };
        };

        const handleTouchCancel = (event) => {
          event.preventDefault();
          if (!canSendTouch()) return;
          ignoreTouchesUntilLift();
          if (event.touches.length === 0) touchGesture = { mode: 'idle', primaryId: null, start: null, last: null };
        };

        const requestElementFullscreen = () => {
          const root = document.documentElement;
          const request = root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen;
          if (typeof request !== 'function') return false;
          const result = request.call(root);
          if (result && typeof result.catch === 'function') {
            void result.catch(() => {
              // iPadOS only permits this call from the gesture that triggered it.
            });
          }
          return true;
        };

        const requestFullscreenFromGesture = () => {
          if (isFullscreen()) return;

          if (requestElementFullscreen()) return;
          // Never enter native video fullscreen until the server has confirmed
          // display-only mode: touch mode needs the DOM overlay to own gestures.
          if (touchCapabilityKnown && !touchEnabled && typeof video.webkitEnterFullscreen === 'function') {
            video.webkitEnterFullscreen();
          }
        };

        const enterFullscreenOnTap = (event) => {
          if (touchEnabled) event.preventDefault();
          if (!isStreaming || isFullscreen()) return;

          // Safari emits both pointerup and touchend for one finger gesture.
          // Let the first event retain user activation, then ignore its twin.
          const now = Date.now();
          if (now - lastFullscreenGestureAt < 750) return;
          lastFullscreenGestureAt = now;
          requestFullscreenFromGesture();
        };

        const installFullscreenEntryTarget = () => {
          document.removeEventListener('pointerup', enterFullscreenOnTap);
          document.removeEventListener('touchend', enterFullscreenOnTap);
          touchSurface.removeEventListener('pointerup', enterFullscreenOnTap);
          touchSurface.removeEventListener('touchend', enterFullscreenOnTap);
          if (touchEnabled && !macControlEnabled) return;
          const target = touchEnabled ? touchSurface : document;
          target.addEventListener('pointerup', enterFullscreenOnTap);
          target.addEventListener('touchend', enterFullscreenOnTap, { passive: false });
        };

        const updateTouchControl = () => {
          touchSurface.hidden = !touchEnabled || !macControlEnabled;
          touchControl.hidden = !touchEnabled;
          touchControl.textContent = macControlEnabled ? 'iPad' : 'Mac';
          touchControl.setAttribute(
            'aria-label',
            macControlEnabled ? 'Give control to iPad' : 'Resume Mac control',
          );
          installFullscreenEntryTarget();
        };

        const setMacControlEnabled = (enabled, requestFullscreen = false) => {
          if (macControlEnabled === enabled) return;
          if (!enabled) resetTouchGesture();
          macControlEnabled = enabled;
          updateTouchControl();
          if (enabled && requestFullscreen) requestFullscreenFromGesture();
        };

        const setTouchEnabled = (enabled) => {
          touchCapabilityKnown = true;
          if (!enabled) resetTouchGesture();
          touchEnabled = enabled === true;
          updateTouchControl();
        };

        // Fullscreen requires a real user activation on iPadOS. Keep this outside
        // stream setup so requesting it never recreates the PeerConnection.
        installFullscreenEntryTarget();
        const handleFullscreenChange = () => {
          if (!isFullscreen()) releaseActiveDrag();
          updateFullscreenHint();
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        touchSurface.addEventListener('touchstart', handleTouchStart, { passive: false });
        touchSurface.addEventListener('touchmove', handleTouchMove, { passive: false });
        touchSurface.addEventListener('touchend', handleTouchEnd, { passive: false });
        touchSurface.addEventListener('touchcancel', handleTouchCancel, { passive: false });
        touchControl.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (!touchEnabled) return;
          setMacControlEnabled(!macControlEnabled, true);
        });

        // This is the stock Deskreen viewer contract: a non-initiating
        // simple-peer receives CALL_USER signals and returns CALL_ACCEPTED signals.
        if (!SimplePeer || !connectSocket) {
          setStatus('Viewer assets failed to load');
          return;
        }
        const socket = connectSocket(window.location.origin, {
          query: { roomId: ROOM_ID },
          forceNew: true,
        });

        const clearViewerSessionState = () => {
          isStreaming = false;
          video.srcObject = null;
          updateFullscreenHint();
        };

        const disposePeer = () => {
          if (!peer) return;
          const stalePeer = peer;
          // Make any synchronous close from destroy stale before it can request recovery.
          peer = null;
          stalePeer.removeAllListeners();
          stalePeer.destroy();
        };

        const recoverFromUnexpectedPeerTermination = (terminatedPeer, reason) => {
          if (
            pageIsTearingDown ||
            peerRecoveryInProgress ||
            peer !== terminatedPeer
          ) {
            return;
          }
          peerRecoveryInProgress = true;
          clearViewerSessionState();
          disposePeer();
          lifecycle = null;
          deviceDetailsGeneration = null;
          registeredGeneration = null;
          needsFreshPeer = true;
          setStatus(`Reconnecting display (${reason})…`);

          // The server transfers authority only after this socket has registered
          // for a generation. Reusing connect keeps that registration canonical.
          socket.disconnect();
          socket.connect();
        };

        const createPeer = () => {
          const nextPeer = new SimplePeer({ initiator: false, config: { iceServers: [] } });
          peer = nextPeer;

          nextPeer.on('signal', (signalData) => {
            if (!lifecycle || peer !== nextPeer) return;
            socket.emit('IPAD_SIGNAL', {
              type: 'CALL_ACCEPTED',
              payload: { signalData },
            });
          });

          nextPeer.on('stream', (stream) => {
            if (peer !== nextPeer) return;
            video.srcObject = stream;
            void video.play().catch(() => {
              console.debug('[iPad Viewer] Safari deferred autoplay');
            });
            isStreaming = true;
            setStatus('Streaming', true);
            updateFullscreenHint();
          });

          nextPeer.on('error', (error) => {
            if (peer !== nextPeer) return;
            console.error('[iPad Viewer] simple-peer error', error);
            recoverFromUnexpectedPeerTermination(nextPeer, 'WebRTC error');
          });

          nextPeer.on('close', () => {
            recoverFromUnexpectedPeerTermination(nextPeer, 'WebRTC closed');
          });
        };

        const resetForPeerRecovery = () => {
          clearViewerSessionState();
          disposePeer();
          createPeer();
        };

        const sendDeviceDetailsWhenReady = () => {
          if (
            !lifecycle ||
            lifecycle.viewer?.socketId !== socket.id ||
            !lifecycle.ownerSocketId ||
            lifecycle.phase !== 'waiting-viewer' ||
            deviceDetailsGeneration === lifecycle.generation
          ) return;

          deviceDetailsGeneration = lifecycle.generation;
          socket.emit('IPAD_DEVICE_DETAILS', {
            os: 'iPadOS',
            deviceType: 'tablet',
            browser: navigator.userAgent,
            deviceScreenWidth: window.screen.width,
            deviceScreenHeight: window.screen.height,
          });
          peerRecoveryInProgress = false;
          setStatus('Waiting for host…');
        };

        const registerForCurrentGeneration = () => {
          if (!socket.connected) return;
          const generation = lifecycle?.generation ?? -1;
          if (registeredGeneration === generation) return;
          registeredGeneration = generation;
          socket.emit('IPAD_REGISTER_VIEWER', {
            logicalViewerId,
            documentId: viewerDocumentId,
          });
        };

        createPeer();

        socket.on('connect', () => {
		  registeredGeneration = null;
          if (needsFreshPeer) {
            resetForPeerRecovery();
            needsFreshPeer = false;
          }
          setStatus('Joining display…');
          // Registration is idempotent. It is the only viewer authority request.
		  registerForCurrentGeneration();
        });

        socket.on('IPAD_TOUCH_CAPABILITY', ({ enabled }) => {
          setTouchEnabled(enabled);
        });

        socket.on('IPAD_LIFECYCLE', (nextLifecycle) => {
          lifecycle = nextLifecycle;
          if (
            lifecycle.sessionId &&
            lifecycle.phase !== 'resetting' &&
            lifecycle.viewer?.socketId !== socket.id
          ) {
            registerForCurrentGeneration();
            return;
          }
          sendDeviceDetailsWhenReady();
        });

        socket.on('IPAD_SIGNAL', (message) => {
          if (
            !message ||
            !message.type ||
            !lifecycle ||
            message.generation !== lifecycle.generation ||
            message.sessionId !== lifecycle.sessionId
          ) return;
          if (message.type === 'CALL_USER') {
            peer?.signal(message.payload.signalData);
          } else if (message.type === 'ALLOWED_TO_CONNECT') {
            setStatus('Starting stream…');
          } else if (message.type === 'DENY_TO_CONNECT' || message.type === 'DISCONNECT_BY_HOST_MACHINE_USER') {
            setStatus('Connection closed');
          }
        });

        socket.on('IPAD_REJECTED', ({ reason }) => {
          if (reason === 'different-viewer-active') {
            setStatus('Display unavailable');
          } else {
            setStatus('Waiting for host…');
          }
        });
        socket.on('IPAD_SUPERSEDED', () => {
          // A different document now owns this persisted viewer identity. It
          // must not reconnect later and steal authority back from that document.
          pageIsTearingDown = true;
		  releaseActiveDrag();
          clearViewerSessionState();
          disposePeer();
          socket.disconnect();
          setStatus('Session replaced');
        });
        socket.on('disconnect', () => {
          if (!pageIsTearingDown) setStatus('Disconnected');
        });

        window.addEventListener('beforeunload', () => {
		  releaseActiveDrag();
          pageIsTearingDown = true;
        });
      })();
    </script>
  </body>
</html>
