name: Validate fresh-Mac bootstrap PR

on:
  push:
    branches:
      - install/fresh-mac-bootstrap

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install/fresh-mac-bootstrap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src/client-viewer
      - name: Run repository validation
        run: |
          node --test scripts/test-ipad-*.mjs
          npm run typecheck
          npm run build
          bash -n scripts/bootstrap scripts/ipad scripts/install scripts/ipad-doctor
          git diff --check origin/main...HEAD
      - name: Verify visual guide is repository-hosted
        run: |
          test -s docs/assets/setup/internet-sharing-ventura.jpeg
          test -s docs/assets/setup/screen-recording-ventura.png
          test -s docs/assets/setup/ipad-add-to-home-screen.webp
          test -s docs/assets/setup/accessibility-ventura.png
          ! grep -Eq '<img src="https?://' docs/setup.md
      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/pr21-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr21-validation.yml
          git commit -m 'Remove temporary PR validation workflow'
          git push origin HEAD:install/fresh-mac-bootstrap
