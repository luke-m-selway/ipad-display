name: Vendor setup screenshots

on:
  push:
    branches:
      - install/fresh-mac-bootstrap

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install/fresh-mac-bootstrap
          fetch-depth: 0
      - name: Download setup screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/setup
          curl -fL --retry 3 --retry-delay 2 \
            'https://beta.ableset.com/images/docs/07-network/sharing-ventura.jpeg' \
            -o docs/assets/setup/internet-sharing-ventura.jpeg
          curl -fL --retry 3 --retry-delay 2 \
            'https://help.coviu.com/hubfs/Screenshot%202023-03-27%20at%204-58-47%20pm-png-1.png' \
            -o docs/assets/setup/screen-recording-ventura.png
          curl -fL --retry 3 --retry-delay 2 \
            'https://cdn.checkie.org/logos/ipad_setup1.webp' \
            -o docs/assets/setup/ipad-add-to-home-screen.webp
          curl -fL --retry 3 --retry-delay 2 \
            'https://dw1.s81c.com/IMWUC/MessageImages/445cbb9452184c8694081f52e8d1cc99.png' \
            -o docs/assets/setup/accessibility-ventura.png
          test -s docs/assets/setup/internet-sharing-ventura.jpeg
          test -s docs/assets/setup/screen-recording-ventura.png
          test -s docs/assets/setup/ipad-add-to-home-screen.webp
          test -s docs/assets/setup/accessibility-ventura.png
      - name: Commit vendored assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/vendor-setup-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/setup .github/workflows/vendor-setup-images.yml
          git commit -m 'Vendor visual setup screenshots'
          git push origin HEAD:install/fresh-mac-bootstrap
